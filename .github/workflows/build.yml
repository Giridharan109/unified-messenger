name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Install and add Android
        run: |
          npm install
          npx cap add android
      - name: Add SMS plugin and permissions
        run: |
          D=android/app/src/main/java/com/giri/unifiedmessenger
          mkdir -p $D
          cp SmsPlugin.java MainActivity.java $D/
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.SEND_SMS" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UnifiedMessenger.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UnifiedMessenger-apk
          path: UnifiedMessenger.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: UnifiedMessenger.apk
